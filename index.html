<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Desktop Cat</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="cat-wrap" style="left:50%;bottom:0">
  <div id="cat" class="idle">
    <svg id="cat-svg" viewBox="0 0 180 180" width="140" height="140">
      <path id="ct-tail" d="M140 115 Q165 85 155 55 Q150 40 145 45" fill="none" stroke-width="6" stroke-linecap="round"/>
      <path id="ct-leg-bl" d="M100 125 Q98 135 104 142" fill="none" stroke-width="7" stroke-linecap="round"/>
      <path id="ct-leg-br" d="M118 125 Q120 135 114 142" fill="none" stroke-width="7" stroke-linecap="round"/>
      <ellipse id="ct-body" cx="108" cy="106" rx="36" ry="24"/>
      <path id="ct-leg-fl" d="M78 120 Q76 133 80 142" fill="none" stroke-width="7" stroke-linecap="round"/>
      <path id="ct-leg-fr" d="M90 125 Q88 135 92 142" fill="none" stroke-width="7" stroke-linecap="round"/>
      <ellipse id="ct-head" cx="68" cy="78" rx="26" ry="24"/>
      <path id="ct-ear-l" d="M50 62 L44 40 L59 56" stroke-linejoin="round" stroke-width="2"/>
      <path id="ct-ear-r" d="M80 62 L90 42 L86 58" stroke-linejoin="round" stroke-width="2"/>
      <path id="ct-ear-inner-l" d="M51 60 L47 46 L58 57" stroke-linejoin="round" stroke-width="1"/>
      <path id="ct-ear-inner-r" d="M79 60 L87 47 L84 57" stroke-linejoin="round" stroke-width="1"/>
      <ellipse id="ct-eye-l" cx="59" cy="74" rx="4.5" ry="5.5"/>
      <ellipse id="ct-eye-r" cx="77" cy="74" rx="4.5" ry="5.5"/>
      <circle id="ct-pupil-l" cx="60" cy="74" r="2.2" fill="#fff"/>
      <circle id="ct-pupil-r" cx="78" cy="74" r="2.2" fill="#fff"/>
      <path id="ct-nose" d="M66 81 L68 83.5 L70 81" fill="#ff8090" stroke="#ff8090" stroke-width=".5"/>
      <path id="ct-mouth" d="M68 83.5 Q64 86 61 84" fill="none" stroke-width="1" stroke-linecap="round"/>
      <path id="ct-mouth2" d="M68 83.5 Q72 86 75 84" fill="none" stroke-width="1" stroke-linecap="round"/>
      <line id="ct-wl1" x1="43" y1="78" x2="56" y2="80" stroke-width=".7" stroke-linecap="round"/>
      <line id="ct-wl2" x1="41" y1="83" x2="56" y2="82" stroke-width=".7" stroke-linecap="round"/>
      <line id="ct-wr1" x1="93" y1="78" x2="80" y2="80" stroke-width=".7" stroke-linecap="round"/>
      <line id="ct-wr2" x1="95" y1="83" x2="80" y2="82" stroke-width=".7" stroke-linecap="round"/>
      <path id="ct-stripe1" d="M98 90 Q104 86 110 90" fill="none" stroke-width="2" stroke-linecap="round" opacity=".3"/>
      <path id="ct-stripe2" d="M108 89 Q114 85 120 89" fill="none" stroke-width="2" stroke-linecap="round" opacity=".3"/>
      <path id="ct-stripe3" d="M85 58 Q88 53 92 58" fill="none" stroke-width="2" stroke-linecap="round" opacity=".3"/>
      <ellipse id="ct-paw-fl" cx="80" cy="144" rx="5" ry="3"/>
      <ellipse id="ct-paw-fr" cx="92" cy="144" rx="5" ry="3"/>
      <ellipse id="ct-paw-bl" cx="104" cy="144" rx="5" ry="3"/>
      <ellipse id="ct-paw-br" cx="114" cy="144" rx="5" ry="3"/>
    </svg>
  </div>
  <div id="speech-bubble"></div>
</div>

<div id="menu" class="hidden">
  <div id="menu-title">🐱 <span id="m-name">Kitty</span></div>
  <div id="menu-stats">
    <div class="mstat"><span>🍽️</span><div class="mbar"><div id="mhunger" style="width:80%"></div></div></div>
    <div class="mstat"><span>🎮</span><div class="mbar"><div id="mhappy" style="width:70%"></div></div></div>
    <div class="mstat"><span>😴</span><div class="mbar"><div id="menergy" style="width:60%"></div></div></div>
  </div>
  <div id="menu-btns">
    <button onclick="feed()">🍽️</button>
    <button onclick="play()">🎮</button>
    <button onclick="goSleep()">😴</button>
    <button onclick="idleAnim('stretch')">🧘</button>
    <button onclick="idleAnim('yawn')">🥱</button>
    <button onclick="idleAnim('scratch')">🫳</button>
  </div>
  <div id="menu-skins">
    <button class="skin-dot" style="background:#ff9e7a" onclick="setSkin('peach')"></button>
    <button class="skin-dot" style="background:#8a8a8a" onclick="setSkin('gray')"></button>
    <button class="skin-dot" style="background:#1a1a1a" onclick="setSkin('black')"></button>
    <button class="skin-dot" style="background:#f5deb3" onclick="setSkin('cream')"></button>
    <button class="skin-dot" style="background:#d4a574" onclick="setSkin('brown')"></button>
  </div>
  <button id="menu-close" onclick="closeMenu()">✕</button>
</div>

<div id="tip">Click the cat 🐱</div>

<script src="script.js"></script>
</body>
</html>
